[package]
name = "bridge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bridge"
path = "src/main.rs"

[features]
full = ["notebook", "lifecycle", "observe", "mcp", "openwebui", "ppv2"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:either"]
lifecycle = ["notebook"]
mcp = []
moleviewer = []
notebook = ["kubernetes"]
observe = []
openwebui = ["kubernetes"]
ppv2 = []

[dependencies]
# --- Memory Allocator ---
mimalloc = "~0.1"

# --- Core Web / Actix Framework ---
actix-files = "~0.6.6"
actix-web = { version = "~4.14", features = ["rustls-0_23", "cookies"] }
actix-web-httpauth = "~0.8"
actix-ws = "~0.4.0"
actix-rt = "2.11.0"
actix-server = "2.6.0"
actix-tls = "3.5.0"
actix-http = "3.13.1"
actix-service = "2.0.3"

# --- Async, Streams & Utilities ---
futures = "~0.3"
futures-util = "~0.3.30"
pin-project = "=1.1.13"
tokio = { version = "~1.53.0", features = ["full"] }
tokio-stream = { version = "~0.1.15", features = ["sync"] }
tokio-tungstenite = { version = "~0.30.0", features = ["url", "rustls-tls-native-roots"] }
parking_lot = "~0.12"

# --- Serialization & Templating ---
serde = { version = "~1.0", features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "~0.7.1"
tera = { version = "~1.20.0", features = ["builtins"] }
toml = "~1.1"

# --- Databases & Caching ---
mongodb = "=3.8"
redis = { version = "=1.4.1", features = ["tokio-comp", "num-bigint"] }

# --- Cryptography, Auth & Security ---
base64ct = "=1.8.3"
jsonwebtoken = { version = "=10.4.0", features = ["use_pem", "rust_crypto"] }
openidconnect = "~4.0"
openssl = "~0.10"
p256 = "=0.14.0"
rand = "~0.10"
rust-argon2 = "~3.0"
rustls = "0.23"
rustls-pki-types = "=1.15.1"
sha2 = "~0.11.0"
tokio-rustls = "~0.26"

# --- Observability & Ergonomics ---
regex = "~1.13"
thiserror = "2"
time = { version = "~0.3.36", features = ["serde"] }
tracing = "~0.1"
tracing-subscriber = "~0.3"
tracing-appender = "0.2.5"
url = "2.5.0"
urlencoding = "2.1.3"
uuid = { version = "~1.24", features = ["v4"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-cloudwatchlogs = "=1.143"

# --- Network & Workspace Dependencies ---
reqwest = { workspace = true, features = ["stream", "json"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "http2", "ring", "tls12"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
utils = { path = "utils" }
bytestring = "1.5.1"

# --- Feature-Gated / Optional Dependencies ---
either = { version = "1.13.0", optional = true }
k8s-openapi = { version = "0.28", features = ["latest"], optional = true }
kube = { version = "~4.2", features = ["runtime", "derive"], optional = true }
schemars = { version = "1.0", optional = true }

[dev-dependencies]
jsonwebkey = { version = "~0.4", features = ["jwt-convert"] }

[workspace]
members = ["frontend", "utils"]

[workspace.dependencies]
quote = "~1.0"
reqwest = "~0.13"
serde_json = "~1.0"
syn = "~3.0"

[profile.dev]
opt-level = 0
debug = 2
lto = false
panic = "unwind"
incremental = true
overflow-checks = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
incremental = true
overflow-checks = false
debug-assertions = false

[profile.release.package.frontend]
opt-level = "z"
debug = false
strip = true
